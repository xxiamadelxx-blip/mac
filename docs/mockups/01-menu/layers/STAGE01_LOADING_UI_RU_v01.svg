<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <style>
    .panel{fill:#061416;fill-opacity:1;stroke:#78cfc1;stroke-opacity:.65;stroke-width:1}
    .title{font-family:'DejaVu Serif';font-weight:bold;fill:#f5ead2;letter-spacing:1.4px}
    .body{font-family:'DejaVu Sans';fill:#f5ead2;letter-spacing:1px}
    .jade{font-family:'DejaVu Sans';fill:#a8fff0;letter-spacing:1px}
    .muted{font-family:'DejaVu Sans';fill:#b5c1bd;letter-spacing:.8px}
  </style>
  <rect class="panel" x="0" y="0" width="83" height="205" rx="0"/>
  <rect class="panel" x="34" y="526" width="322" height="221" rx="15"/>
  <text class="title" x="42" y="48" font-size="15">ЛУННЫЙ</text>
  <text class="title" x="42" y="70" font-size="15">САД</text>
  <text class="jade" x="42" y="98" font-size="10">ПЕРВАЯ</text>
  <text class="jade" x="42" y="114" font-size="10">ВОЛНА</text>
  <text class="muted" x="42" y="146" font-size="8">ТИШИНА</text>
  <text class="muted" x="42" y="161" font-size="8">ПЕРЕД БОЕМ</text>
  <text class="title" x="195" y="581" font-size="18" text-anchor="middle">ЗАТОПЛЕННЫЙ САД ЛОТОСОВ</text>
  <text class="jade" x="195" y="613" font-size="11" text-anchor="middle">ГЛАВА 1 — ПЕРВАЯ ВОЛНА</text>
  <rect x="72" y="651" width="246" height="8" rx="4" fill="#0f3435" stroke="#78cfc1" stroke-width="1"/>
  <rect x="74" y="653" width="147" height="4" rx="2" fill="#a8fff0"/>
  <text class="body" x="195" y="688" font-size="13" text-anchor="middle">ЗАГРУЗКА</text>
  <text class="muted" x="195" y="720" font-size="9" text-anchor="middle">ДВИГАЙСЯ, ЧТОБЫ ВЫЖИТЬ</text>
</svg>
