<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Moonveil: Eclipse — главный экран</title>
  <desc id="desc">Кандидат мягкого tonal UI для вертикального экрана 390 на 844 пикселей.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b29"/>
      <stop offset="0.52" stop-color="#12313a"/>
      <stop offset="1" stop-color="#07151f"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f3e8c6" stop-opacity="0.28"/>
      <stop offset="0.62" stop-color="#b7d6c3" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0b1b29" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173942" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0d252f" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="jadeButton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9d9c7"/>
      <stop offset="1" stop-color="#6e9b8c"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a88f68" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d5bd8c" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a88f68" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset dy="8" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.34"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="ripples" width="98" height="72" patternUnits="userSpaceOnUse">
      <path d="M8 23 C23 14 40 14 55 23 C70 32 87 32 98 25" fill="none" stroke="#8fb8ab" stroke-opacity="0.11" stroke-width="1"/>
      <path d="M-22 49 C-7 40 10 40 25 49 C40 58 57 58 72 49 C87 40 104 40 119 49" fill="none" stroke="#d7e1cc" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="390" height="844" fill="url(#bg)"/>
  <ellipse cx="299" cy="136" rx="150" ry="150" fill="url(#moonGlow)"/>
  <circle cx="301" cy="126" r="78" fill="#f4ebcf" fill-opacity="0.13"/>
  <circle cx="328" cy="103" r="75" fill="#0b1b29" fill-opacity="0.78"/>
  <circle cx="301" cy="126" r="62" fill="none" stroke="#d8c89c" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="0" y="0" width="390" height="844" fill="url(#ripples)"/>

  <g opacity="0.7">
    <path d="M23 305 C42 287 55 292 67 307 C76 318 86 321 100 314" fill="none" stroke="#86a999" stroke-opacity="0.48" stroke-width="2"/>
    <path d="M30 319 C45 307 58 311 69 323 C79 334 91 334 104 326" fill="none" stroke="#b4cfb7" stroke-opacity="0.24" stroke-width="1"/>
    <path d="M291 300 C307 288 320 291 331 305 C341 317 352 319 370 309" fill="none" stroke="#86a999" stroke-opacity="0.48" stroke-width="2"/>
    <path d="M284 317 C300 307 315 312 325 324 C336 337 351 337 369 326" fill="none" stroke="#b4cfb7" stroke-opacity="0.24" stroke-width="1"/>
  </g>

  <g aria-label="moonveil emblem" transform="translate(195 193)">
    <circle r="44" fill="#0a202b" fill-opacity="0.48" stroke="#cbb889" stroke-opacity="0.52" stroke-width="1"/>
    <path d="M0-34 C-20-25-24-8-13 8 C-7 17-4 25 0 34 C4 25 7 17 13 8 C24-8 20-25 0-34Z" fill="#b5d5c1" fill-opacity="0.83"/>
    <path d="M-37 8 C-22-3-10 1 0 20 C-13 21-27 19-37 8Z" fill="#7ea998" fill-opacity="0.92"/>
    <path d="M37 8 C22-3 10 1 0 20 C13 21 27 19 37 8Z" fill="#7ea998" fill-opacity="0.92"/>
    <path d="M-25 25 C-13 18-5 20 0 36 C-10 37-19 34-25 25Z" fill="#d8c89c" fill-opacity="0.75"/>
    <path d="M25 25 C13 18 5 20 0 36 C10 37 19 34 25 25Z" fill="#d8c89c" fill-opacity="0.75"/>
    <circle r="5" fill="#eee6cf"/>
  </g>

  <text x="195" y="280" text-anchor="middle" fill="#f2ead4" font-family="Arial, Noto Sans, sans-serif" font-size="25" font-weight="700" letter-spacing="4">MOONVEIL</text>
  <text x="195" y="306" text-anchor="middle" fill="#b9d7c6" font-family="Arial, Noto Sans, sans-serif" font-size="11" font-weight="600" letter-spacing="5">E C L I P S E</text>
  <rect x="91" y="322" width="208" height="1" fill="url(#brass)"/>
  <text x="195" y="344" text-anchor="middle" fill="#e7ddc5" font-family="Arial, Noto Sans, sans-serif" font-size="10" letter-spacing="2">ПАДЕНИЕ ЛУННОГО САДА</text>

  <g filter="url(#softShadow)">
    <rect x="30" y="365" width="330" height="355" rx="28" fill="#07161f" fill-opacity="0.42"/>
    <rect x="34" y="361" width="322" height="355" rx="26" fill="url(#panel)" stroke="#bba878" stroke-opacity="0.38" stroke-width="1"/>
    <path d="M71 386 H319" stroke="#d2bd8a" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="70" cy="386" r="2.5" fill="#b5d5c1"/>
    <circle cx="320" cy="386" r="2.5" fill="#b5d5c1"/>
  </g>

  <text x="195" y="410" text-anchor="middle" fill="#b5d5c1" font-family="Arial, Noto Sans, sans-serif" font-size="10" font-weight="600" letter-spacing="2">ЗАТОПЛЕННЫЙ САД ЛУННОГО ЛОТОСА</text>

  <g>
    <rect x="58" y="430" width="274" height="58" rx="18" fill="url(#jadeButton)"/>
    <rect x="58.5" y="430.5" width="273" height="57" rx="17.5" fill="none" stroke="#e9ead7" stroke-opacity="0.36"/>
    <circle cx="87" cy="459" r="10" fill="#173942" fill-opacity="0.38"/>
    <path d="M84 453 L93 459 L84 465Z" fill="#f3edd8"/>
    <text x="202" y="464" text-anchor="middle" fill="#10262f" font-family="Arial, Noto Sans, sans-serif" font-size="15" font-weight="700" letter-spacing="1">НАЧАТЬ ЗАБЕГ</text>
  </g>

  <g fill="#e9e3d1" font-family="Arial, Noto Sans, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    <rect x="58" y="504" width="130" height="52" rx="16" fill="#23464e" stroke="#af9870" stroke-opacity="0.62"/>
    <text x="123" y="535">ПЕРСОНАЖИ</text>
    <rect x="202" y="504" width="130" height="52" rx="16" fill="#23464e" stroke="#af9870" stroke-opacity="0.62"/>
    <text x="267" y="535">ОРУЖИЕ</text>
    <rect x="58" y="568" width="130" height="52" rx="16" fill="#23464e" stroke="#af9870" stroke-opacity="0.62"/>
    <text x="123" y="599">АРТЕФАКТЫ</text>
    <rect x="202" y="568" width="130" height="52" rx="16" fill="#23464e" stroke="#af9870" stroke-opacity="0.62"/>
    <text x="267" y="599">НАСТРОЙКИ</text>
  </g>

  <g opacity="0.72">
    <path d="M76 655 C91 646 105 647 119 656" fill="none" stroke="#9fc4b1" stroke-opacity="0.55" stroke-width="1"/>
    <path d="M271 656 C285 647 299 647 314 656" fill="none" stroke="#9fc4b1" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="195" cy="656" r="3" fill="#d2bd8a" fill-opacity="0.72"/>
  </g>

  <text x="195" y="680" text-anchor="middle" fill="#9cb8ae" font-family="Arial, Noto Sans, sans-serif" font-size="10" letter-spacing="1">ДВИГАЙСЯ • ВЫЖИВАЙ • СОБИРАЙ СИНЕРГИИ</text>
  <text x="195" y="751" text-anchor="middle" fill="#b8c9bd" font-family="Arial, Noto Sans, sans-serif" font-size="10" letter-spacing="1">ОДИН САД. ОДНА НОЧЬ. БЕСКОНЕЧНОЕ ЗАТМЕНИЕ.</text>
  <text x="195" y="806" text-anchor="middle" fill="#819b96" font-family="Arial, Noto Sans, sans-serif" font-size="9" letter-spacing="1">v0.1 • OFFLINE-FIRST • 2D SURVIVORS</text>
</svg>