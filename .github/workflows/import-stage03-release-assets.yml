name: Verify Stage 03 individual assets from Supabase Storage

on:
  push:
    paths:
      - docs/ci/STAGE03_IMPORT_REQUEST.json
      - .github/scripts/download_supabase_asset.py
      - .github/scripts/import_stage03_assets.py
      - .github/workflows/import-stage03-release-assets.yml
      - scripts/assets/upload_assets_to_supabase.py
  workflow_dispatch:
    inputs:
      request_file:
        description: Request manifest in the repository
        required: true
        default: docs/ci/STAGE03_IMPORT_REQUEST.json
        type: string

permissions:
  contents: read

concurrency:
  group: stage03-individual-asset-intake
  cancel-in-progress: false

jobs:
  verify:
    name: Download and verify individual Stage 03 assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_STORAGE_API_KEY: ${{ secrets.SUPABASE_STORAGE_API_KEY }}
      SUPABASE_STORAGE_AUTH_TOKEN: ${{ secrets.SUPABASE_STORAGE_AUTH_TOKEN }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Resolve request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REQUEST_FILE: ${{ inputs.request_file }}
        shell: bash
        run: |
          set -euo pipefail
          request_file="docs/ci/STAGE03_IMPORT_REQUEST.json"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_REQUEST_FILE:-}" ]]; then
            request_file="${INPUT_REQUEST_FILE}"
          fi
          if [[ "${request_file}" == /* || "${request_file}" == *".."* || "${request_file}" == *"\\"* ]]; then
            echo "Unsafe request path: ${request_file}" >&2
            exit 1
          fi
          if [[ ! -f "${request_file}" ]]; then
            echo "Request file does not exist: ${request_file}" >&2
            exit 1
          fi
          status="$(jq -r '.status // ""' "${request_file}")"
          if [[ "${status}" != "READY" ]]; then
            echo "Request status is ${status:-<empty>}; no binary intake is run."
            echo "should_import=false" >> "${GITHUB_OUTPUT}"
            echo "request_file=${request_file}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          bucket="$(jq -r '.storage.bucket // ""' "${request_file}")"
          project_ref="$(jq -r '.storage.project_ref // ""' "${request_file}")"
          count="$(jq '.assets | length' "${request_file}")"
          if [[ "${project_ref}" != "ylhbihgrchtqzaphuxvy" || "${bucket}" != "visual-assets" ]]; then
            echo "Request does not target the canonical MAC Storage project/bucket." >&2
            exit 1
          fi
          if [[ "${count}" -le 0 ]]; then
            echo "READY request contains no assets." >&2
            exit 1
          fi
          if jq -e '[.assets[] | select((.local_path | ascii_downcase | endswith(".zip")) or (.object | ascii_downcase | endswith(".zip")) or (.content_type == "application/zip"))] | length > 0' "${request_file}" >/dev/null; then
            echo "Archive entries are forbidden; list individual visual files." >&2
            exit 1
          fi
          {
            echo "should_import=true"
            echo "request_file=${request_file}"
            echo "asset_count=${count}"
          } >> "${GITHUB_OUTPUT}"
          echo "Request: ${request_file}; assets: ${count}"

      - name: Check Storage credentials
        if: steps.request.outputs.should_import == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_STORAGE_API_KEY:-}" || -z "${SUPABASE_STORAGE_AUTH_TOKEN:-}" ]]; then
            echo "BLOCKED_BINARY_ARTIFACT: Supabase Storage URL/API key/auth token are not configured as CI secrets." >&2
            exit 2
          fi

      - name: Download and verify each Storage object
        if: steps.request.outputs.should_import == 'true'
        env:
          REQUEST_FILE: ${{ steps.request.outputs.request_file }}
        shell: bash
        run: |
          set -euo pipefail
          download_root="${RUNNER_TEMP}/stage03-assets"
          mkdir -p "${download_root}"
          : > "${RUNNER_TEMP}/stage03-download.log"
          while IFS= read -r record; do
            object_path="$(jq -r '.object' <<<"${record}")"
            local_path="$(jq -r '.local_path' <<<"${record}")"
            sha256="$(jq -r '.sha256' <<<"${record}")"
            size_bytes="$(jq -r '.size_bytes' <<<"${record}")"
            output="${download_root}/${local_path}"
            mkdir -p "$(dirname "${output}")"
            python3 .github/scripts/download_supabase_asset.py \
              --bucket "visual-assets" \
              --object "${object_path}" \
              --output "${output}" \
              --expected-sha256 "${sha256}" \
              --expected-size "${size_bytes}" \
              2>&1 | tee -a "${RUNNER_TEMP}/stage03-download.log"
          done < <(jq -c '.assets[]' "${REQUEST_FILE}")

      - name: Validate and stage assets for the build workspace
        if: steps.request.outputs.should_import == 'true'
        env:
          REQUEST_FILE: ${{ steps.request.outputs.request_file }}
        shell: bash
        run: |
          set -euo pipefail
          target_root="${RUNNER_TEMP}/mac-build-assets/docs/mockups/03-heroes"
          python3 .github/scripts/import_stage03_assets.py \
            "${REQUEST_FILE}" \
            "${RUNNER_TEMP}/stage03-assets" \
            "${target_root}" \
            2>&1 | tee "${RUNNER_TEMP}/stage03-import.log"
          {
            echo "### Stage 03 individual asset intake"
            echo "Request: ${REQUEST_FILE}"
            echo "Assets: ${{ steps.request.outputs.asset_count }}"
            echo "Storage: visual-assets"
            echo "Result: VERIFIED in build workspace"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish text evidence
        if: always() && steps.request.outputs.should_import == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Evidence files"
            echo '```text'
            if [[ -f "${RUNNER_TEMP}/stage03-download.log" ]]; then
              sed -n '1,240p' "${RUNNER_TEMP}/stage03-download.log"
            fi
            if [[ -f "${RUNNER_TEMP}/stage03-import.log" ]]; then
              sed -n '1,240p' "${RUNNER_TEMP}/stage03-import.log"
            fi
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
