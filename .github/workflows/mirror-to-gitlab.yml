name: Mirror GitHub to GitLab

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip until the GitLab secret is configured
        if: ${{ env.GITLAB_TOKEN == '' }}
        run: |
          echo "::warning::GITLAB_TOKEN is not configured; GitLab mirror was skipped."
          echo "Add the secret in GitHub Settings > Secrets and variables > Actions."

      - name: Push all branches and tags to GitLab
        if: ${{ env.GITLAB_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # GitHub is the canonical source. The initial GitLab README is
          # intentionally replaced on the first successful synchronization.
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/xxiamadelxx-blip/mac.git"

          # Remove the symbolic origin/HEAD ref so it cannot become a branch named HEAD.
          git update-ref -d refs/remotes/origin/HEAD || true

          # Keep GitLab as a downstream mirror of GitHub.
          git push --force --prune gitlab "refs/remotes/origin/*:refs/heads/*"
          git push --force --prune gitlab "refs/tags/*:refs/tags/*"
