version: 2.1

jobs:
  godot-validate:
    docker:
      - image: barichello/godot-ci:4.7.2
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - godot-import-v1-{{ checksum "project.godot" }}
            - godot-import-v1-
      - run:
          name: Validate Godot project
          command: |
            set -euo pipefail
            test -f project.godot
            test -f scenes/menu/menu.tscn
            test -f scenes/arena/arena.tscn
            test -f scripts/menu/menu_controller.gd
            test -f scripts/arena/arena_controller.gd
            godot --headless --path . --editor --quit
      - save_cache:
          key: godot-import-v1-{{ checksum "project.godot" }}
          paths:
            - .godot/imported

  android-debug-apk:
    docker:
      - image: barichello/godot-ci:4.7.2
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - godot-import-v1-{{ checksum "project.godot" }}
            - godot-import-v1-
      - run:
          name: Import Godot project
          command: |
            set -euo pipefail
            godot --headless --path . --editor --quit
      - save_cache:
          key: godot-import-v1-{{ checksum "project.godot" }}
          paths:
            - .godot/imported
      - run:
          name: Build Android debug APK
          command: |
            set -euo pipefail
            mkdir -p build/android
            godot --headless --path . --export-debug "Android Debug" build/android/Moonveil-Eclipse-debug.apk
            test -s build/android/Moonveil-Eclipse-debug.apk
      - store_artifacts:
          path: build/android
          destination: android

workflows:
  build-and-test:
    jobs:
      - godot-validate
      - android-debug-apk:
          requires:
            - godot-validate
          filters:
            branches:
              only:
                - main
